[project]
name = "module-knowledge"
version = "0.1.0"
description = "Local, evidence-backed note-writing pilot for university modules"
requires-python = ">=3.12,<3.15"
dependencies = [
    "python-docx>=1.2,<2",
    "python-pptx>=1,<2",
    "pymupdf>=1.26,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
module-knowledge = "module_knowledge.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/module_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
